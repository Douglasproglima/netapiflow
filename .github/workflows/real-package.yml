name: Real package

on:
  workflow_call:
    inputs:
      run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  real-package:
    name: real-package
    if: inputs.run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only-sql-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pack-packages

      - name: Test the scripts of this job
        run: node --test scripts/*.test.mjs

      - name: What each package declares as a dependency matches its approved snapshot
        run: node scripts/nuspec-snapshot.mjs --feed "$FEED"

      - name: Create a new webapi app
        run: dotnet new webapi -f net10.0 -n UserApp -o "$USER_APP"

      - name: Paste the README blocks into the app and build it
        run: node scripts/build-user-app.mjs --app "$USER_APP" --feed "$FEED" --version "$PACKAGE_VERSION"

      - name: Run the app in Development and in Production and walk the HTTP script
        run: node scripts/package-scenarios.mjs --dll "$USER_APP/bin/Release/net10.0/UserApp.dll"

      - name: Open the panel in a real browser while a request runs and after it ended
        run: node scripts/verify-live-panel.mjs --dll "$USER_APP/bin/Release/net10.0/UserApp.dll"

      - name: Build the database app against this build and against the last published package
        run: node scripts/build-database-apps.mjs --out "$DATABASE_APPS" --feed "$FEED" --version "$PACKAGE_VERSION"
        env:
          DATABASE_APPS: ${{ runner.temp }}/database

      - name: Walk the database scenarios on PostgreSQL and SQL Server against both
        run: >
          node scripts/package-database-scenarios.mjs
          --new-dll "$DATABASE_APPS/new/bin/Release/net10.0/DatabaseApp.dll"
          --old-dll "$DATABASE_APPS/old/bin/Release/net10.0/DatabaseApp.dll"
          --postgres "Host=127.0.0.1;Port=5432;Username=postgres;Password=ci-only-postgres;Database=app"
          --sqlserver "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Ci-only-sql-1;TrustServerCertificate=True;Encrypt=True"
        env:
          DATABASE_APPS: ${{ runner.temp }}/database

      - name: Stop any app left running
        if: always()
        run: |
          pkill -f UserApp.dll || true
          pkill -f DatabaseApp.dll || true

  comparison:
    name: comparison
    if: inputs.run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pack-packages

      - name: Build the same app against this build and against the last published package
        run: node scripts/build-comparison-apps.mjs --out "$COMPARISON_APPS" --feed "$FEED" --version "$PACKAGE_VERSION"

      - name: Walk the same scenarios against both and compare what they do
        run: >
          node scripts/compare-with-published.mjs
          --new-dll "$COMPARISON_APPS/new/bin/Release/net10.0/ComparisonApp.dll"
          --old-dll "$COMPARISON_APPS/old/bin/Release/net10.0/ComparisonApp.dll"

      - name: Stop any app left running
        if: always()
        run: pkill -f ComparisonApp.dll || true
