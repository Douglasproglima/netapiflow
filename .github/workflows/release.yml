name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  release:
    name: pack-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/NetApiFlow.Dashboard/ClientApp/.nvmrc
          cache: npm
          cache-dependency-path: src/NetApiFlow.Dashboard/ClientApp/package-lock.json

      # Built explicitly, once, before `dotnet build`: see the matching step in ci.yml for why
      # (PR #17 race between parallel MSBuild passes over NetApiFlow.Dashboard's own dist/).
      - name: Build dashboard UI
        working-directory: src/NetApiFlow.Dashboard/ClientApp
        run: |
          npm ci
          npm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore NetApiFlow.slnx

      - name: Build
        run: dotnet build NetApiFlow.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: |
          set -e
          dotnet test tests/NetApiFlow.Tests -c Release --no-build
          dotnet test tests/NetApiFlow.IntegrationTests -c Release --no-build
          dotnet test tests/NetApiFlow.Storage.Tests -c Release --no-build

      - name: Pack the six packages
        run: >
          dotnet pack NetApiFlow.slnx -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -o ./nupkgs

      # Trusted Publishing (OIDC): no nuget.org API key stored in a repository secret. Requires
      # the Trusted Publishing policy configured on nuget.org for this repository and this
      # workflow file *before* the first tag (tarefa 7.7, manual step outside this repo).
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Douglasproglima

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Secondary mirror, not the primary distribution channel: GitHub Packages requires every
      # consumer to authenticate with a PAT even for a public NuGet package, so nuget.org (above)
      # stays what the README and quick start point people to.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source https://nuget.pkg.github.com/Douglasproglima/index.json
          --skip-duplicate
