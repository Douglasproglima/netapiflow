name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Detects documentation-only changes so build-test and secret-scan can report "skipped" (which
  # satisfies a required status check) instead of never running at all. A workflow-level
  # `paths-ignore` would leave required checks permanently pending on a docs-only PR, since GitHub
  # branch protection waits for a status that a skipped *workflow* never reports (D-64).
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      clientapp_changed: ${{ steps.filter.outputs.clientapp_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine if only docs changed
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No usable base SHA (new branch or force-push), treating as a full build." >&2
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "clientapp_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qvE '\.md$|^docs/|^\.claude/'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE '^src/NetApiFlow\.Dashboard/ClientApp/'; then
            echo "clientapp_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "clientapp_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    name: build-test (${{ matrix.os }})
    needs: detect-changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A job-level `if` here would stop the matrix from ever expanding on a skip, so GitHub reports
    # a single literal "build-test (${{ matrix.os }})" check instead of one per OS. Required status
    # checks name the OS explicitly, so a docs-only PR would block forever waiting on a check that
    # never gets created. Skipping every step instead keeps both OS-specific job names intact.
    steps:
      - if: needs.detect-changes.outputs.docs_only != 'true'
        uses: actions/checkout@v7

      - name: Setup .NET
        if: needs.detect-changes.outputs.docs_only != 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node
        if: needs.detect-changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: src/NetApiFlow.Dashboard/ClientApp/.nvmrc
          cache: npm
          cache-dependency-path: src/NetApiFlow.Dashboard/ClientApp/package-lock.json

      # Built explicitly, once, before `dotnet build`: NetApiFlow.Dashboard.csproj's own
      # BuildAngularClient MSBuild target assumes it only ever runs once per outer,
      # TargetFramework-less pass of that one project, but a solution build with
      # ProjectReferences into it (NetApiFlow.IntegrationTests, samples) can trigger more than one
      # such pass under MSBuild's parallel scheduling, racing on the same dist/ output (PR #17).
      # With dist/ already fresh, every one of those passes sees its Inputs/Outputs check satisfied
      # and skips `npm run build` entirely, so the race has nothing left to race on.
      - name: Build dashboard UI
        if: needs.detect-changes.outputs.docs_only != 'true'
        working-directory: src/NetApiFlow.Dashboard/ClientApp
        run: |
          npm ci
          npm run build

      - name: Restore
        if: needs.detect-changes.outputs.docs_only != 'true'
        run: dotnet restore NetApiFlow.slnx

      - name: Format check
        if: needs.detect-changes.outputs.docs_only != 'true'
        run: dotnet format NetApiFlow.slnx --verify-no-changes --no-restore

      - name: Build
        if: needs.detect-changes.outputs.docs_only != 'true'
        run: dotnet build NetApiFlow.slnx -c Release --no-restore

      - name: Test
        if: needs.detect-changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -e
          dotnet test tests/NetApiFlow.Tests -c Release --no-build --collect:"XPlat Code Coverage"
          dotnet test tests/NetApiFlow.IntegrationTests -c Release --no-build --collect:"XPlat Code Coverage"
          # Testcontainers needs Docker, unavailable on GitHub-hosted windows-latest runners (tarefa 6.5).
          if [ "${{ runner.os }}" != "Windows" ]; then
            dotnet test tests/NetApiFlow.Storage.Tests -c Release --no-build --collect:"XPlat Code Coverage"
          fi

      - name: Pack (verification only)
        if: needs.detect-changes.outputs.docs_only != 'true'
        run: dotnet pack NetApiFlow.slnx -c Release --no-build

  # D-76: visual-quality findings never fail this job (`|| true` below). The detector runs in
  # warn-only mode for a full cycle before the Planejadora decides whether it should block.
  # R-15: the GitHub-hosted runner doesn't run as root, so the detector's Chromium shouldn't need
  # `--no-sandbox` here; that flag is only a known fallback for someone running this same scan
  # locally inside a root container.
  visual-quality:
    name: visual-quality
    needs: detect-changes
    if: needs.detect-changes.outputs.clientapp_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netapiflow_sample
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/NetApiFlow.Dashboard/ClientApp/.nvmrc
          cache: npm
          cache-dependency-path: src/NetApiFlow.Dashboard/ClientApp/package-lock.json

      - name: Build dashboard UI
        working-directory: src/NetApiFlow.Dashboard/ClientApp
        run: |
          npm ci
          npm run build

      - name: Build sample
        run: dotnet build samples/SampleApi.Controllers/SampleApi.Controllers.csproj -c Debug -f net10.0

      - name: Run sample and generate real requests
        shell: bash
        run: |
          (cd samples/SampleApi.Controllers/bin/Debug/net10.0 && \
            ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:60803 \
            dotnet SampleApi.Controllers.dll) &
          for i in $(seq 1 30); do
            curl -sf http://localhost:60803/flow >/dev/null && break
            sleep 1
          done

          curl -s http://localhost:60803/api/orders/1 -o /dev/null
          curl -s http://localhost:60803/api/orders/2/confirm -o /dev/null
          curl -s http://localhost:60803/api/orders/3/slow -o /dev/null

          TRACE_ID=$(curl -s "http://localhost:60803/flow/api/traces?limit=1&status=Error" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{console.log(JSON.parse(d).items[0].traceId);})")
          echo "TRACE_ID=$TRACE_ID" >> "$GITHUB_ENV"

      - name: Run Impeccable detector (warn-only)
        working-directory: src/NetApiFlow.Dashboard/ClientApp
        run: |
          npx impeccable detect --github --viewport 390x844 \
            "http://localhost:60803/flow?trace=${TRACE_ID}" \
            "http://localhost:60803/flow/history" \
            "http://localhost:60803/flow/components" \
            "http://localhost:60803/flow/insights" \
            "http://localhost:60803/flow/architecture" \
            "http://localhost:60803/flow/runner" || true

          npx impeccable detect --github \
            "http://localhost:60803/flow?trace=${TRACE_ID}" \
            "http://localhost:60803/flow/history" \
            "http://localhost:60803/flow/components" \
            "http://localhost:60803/flow/insights" \
            "http://localhost:60803/flow/architecture" \
            "http://localhost:60803/flow/runner" || true

  secret-scan:
    name: secret-scan
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml -v
