version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "MediatR"
      - dependency-name: "Microsoft.Data.SqlClient"
      - dependency-name: "Microsoft.EntityFrameworkCore*"
      - dependency-name: "Microsoft.Extensions.FileProviders.Embedded"
      - dependency-name: "ModelContextProtocol*"
      - dependency-name: "NetApiFlow*"
      - dependency-name: "Npgsql*"
      - dependency-name: "OpenTelemetry*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "npm"
    directory: "/src/NetApiFlow.Dashboard/ClientApp"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # @angular/build and @angular/compiler-cli pin a strict typescript peer range
      # (>=6.0 <6.1, confirmed in their package.json); a patch bump of Angular doesn't widen
      # it. TypeScript 7 needs its own PR once Angular's peer range allows it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # .claude/rules/design-quality.md: impeccable is pinned on purpose, updated only as a
      # deliberate decision after reading its changelog, never via an automated bump.
      - dependency-name: "impeccable"
