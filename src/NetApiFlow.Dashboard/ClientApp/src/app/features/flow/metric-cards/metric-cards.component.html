@if (loading()) {
  <p class="metric-cards__status" role="status">Loading…</p>
} @else if (error()) {
  <p class="metric-cards__status metric-cards__status--error" role="alert">{{ error() }}</p>
} @else {
  <div class="metric-cards">
    @for (card of cards(); track card.label) {
      <mat-card
        appearance="outlined"
        class="metric-cards__card"
        [class.metric-cards__card--highlight]="card.highlight"
      >
        <svg
          class="metric-cards__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
        >
          @switch (card.icon) {
            @case ('traces') {
              <path
                d="M4 12 H9 L11 6 L14 18 L16 12 H20"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            }
            @case ('success') {
              <circle cx="12" cy="12" r="8.5" />
              <path d="M8.2 12.3 L10.7 14.8 L16 9" stroke-linecap="round" stroke-linejoin="round" />
            }
            @case ('errors') {
              <circle cx="12" cy="12" r="8.5" />
              <path d="M9 9 L15 15 M15 9 L9 15" stroke-linecap="round" />
            }
            @case ('avg') {
              <circle cx="12" cy="12.5" r="8" />
              <path d="M12 8 V12.5 L15.2 14.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M9.5 3 H14.5" stroke-linecap="round" />
            }
            @case ('max') {
              <circle cx="12" cy="12.5" r="8" />
              <path d="M12 8 V12.5 L16 10.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M9.5 3 H14.5" stroke-linecap="round" />
            }
            @case ('steps') {
              <path
                d="M4 18 H9 V14 H14 V10 H19 V6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            }
          }
        </svg>
        <span class="metric-cards__value">{{ card.value }}</span>
        <span class="metric-cards__label">{{ card.label }}</span>
      </mat-card>
    }
  </div>
}
