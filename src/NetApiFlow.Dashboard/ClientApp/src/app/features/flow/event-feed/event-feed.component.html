<mat-card appearance="outlined" class="event-feed" [class.event-feed--collapsed]="collapsed()">
  <div class="event-feed__header">
    <h3 class="event-feed__title">Live events</h3>
    <button
      mat-icon-button
      type="button"
      class="event-feed__toggle"
      [attr.aria-label]="collapsed() ? 'Expand live events' : 'Collapse live events'"
      (click)="toggleCollapsed()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        width="18"
        height="18"
        [class.event-feed__chevron--collapsed]="collapsed()"
      >
        <path d="M6 9 L12 15 L18 9" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
  @if (!collapsed()) {
    @if (events().length === 0) {
      <p class="event-feed__status">No events yet.</p>
    } @else {
      <ul class="event-feed__list">
        @for (event of events(); track event.eventId) {
          <li class="event-feed__item">
            <span class="event-feed__time">{{ event.timestamp }}</span>
            <span class="event-feed__type">{{ event.type }}</span>
            <span class="event-feed__label">{{ eventLabel(event) }}</span>
          </li>
        }
      </ul>
    }
  }
</mat-card>
