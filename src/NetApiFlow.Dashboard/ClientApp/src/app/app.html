@if (isNarrow()) {
  <div class="app-shell__topbar">
    <button mat-icon-button type="button" aria-label="Toggle navigation" (click)="toggleSidenav()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        width="22"
        height="22"
      >
        <path d="M4 7 H20 M4 12 H20 M4 17 H20" stroke-linecap="round" />
      </svg>
    </button>
    <img
      class="app-shell__logo app-shell__logo--dark"
      src="logo-mark-dark.svg"
      alt=""
      width="22"
      height="22"
    />
    <img
      class="app-shell__logo app-shell__logo--light"
      src="logo-mark-light.svg"
      alt=""
      width="22"
      height="22"
    />
    <span class="app-shell__topbar-title">NetApiFlow</span>
  </div>
}

<mat-sidenav-container class="app-shell">
  <mat-sidenav
    class="app-shell__sidenav"
    [mode]="isNarrow() ? 'over' : 'side'"
    [opened]="!isNarrow()"
    [disableClose]="!isNarrow()"
  >
    <div class="app-shell__brand">
      <img
        class="app-shell__logo app-shell__logo--dark"
        src="logo-mark-dark.svg"
        alt=""
        width="28"
        height="28"
      />
      <img
        class="app-shell__logo app-shell__logo--light"
        src="logo-mark-light.svg"
        alt=""
        width="28"
        height="28"
      />
      <div class="app-shell__brand-text">
        <h1 class="app-shell__title">NetApiFlow</h1>
        <span class="app-shell__version naf-eyebrow">v{{ version }}</span>
      </div>
    </div>
    <mat-nav-list class="app-shell__nav">
      <a
        mat-list-item
        routerLink="/flow"
        routerLinkActive="app-shell__link--active"
        class="app-shell__link"
        (click)="closeSidenavIfNarrow()"
      >
        <svg
          matListItemIcon
          class="app-shell__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <circle cx="6" cy="18" r="2.4" />
          <circle cx="18" cy="6" r="2.4" />
          <path d="M6 15.6 V10 a4 4 0 0 1 4-4 H15.6" stroke-linecap="round" />
        </svg>
        <span matListItemTitle>Flow</span>
      </a>
      <a
        mat-list-item
        routerLink="/history"
        routerLinkActive="app-shell__link--active"
        class="app-shell__link"
        (click)="closeSidenavIfNarrow()"
      >
        <svg
          matListItemIcon
          class="app-shell__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <circle cx="12" cy="12" r="8.4" />
          <path d="M12 7.2 V12 L15.2 14.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span matListItemTitle>History</span>
      </a>
      <a
        mat-list-item
        routerLink="/components"
        routerLinkActive="app-shell__link--active"
        class="app-shell__link"
        (click)="closeSidenavIfNarrow()"
      >
        <svg
          matListItemIcon
          class="app-shell__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <rect x="4" y="4" width="7" height="7" rx="1.4" />
          <rect x="13" y="4" width="7" height="7" rx="1.4" />
          <rect x="4" y="13" width="7" height="7" rx="1.4" />
          <rect x="13" y="13" width="7" height="7" rx="1.4" />
        </svg>
        <span matListItemTitle>Components</span>
      </a>
      <a
        mat-list-item
        routerLink="/runner"
        routerLinkActive="app-shell__link--active"
        class="app-shell__link"
        (click)="closeSidenavIfNarrow()"
      >
        <svg
          matListItemIcon
          class="app-shell__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <path d="M6 4.5 L19 12 L6 19.5 Z" stroke-linejoin="round" />
        </svg>
        <span matListItemTitle>Runner</span>
      </a>
      <button mat-list-item type="button" class="app-shell__link" (click)="openAbout()">
        <svg
          matListItemIcon
          class="app-shell__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <circle cx="12" cy="12" r="8.4" />
          <path d="M12 11 V16.5" stroke-linecap="round" />
          <circle cx="12" cy="7.8" r="0.9" fill="currentColor" stroke="none" />
        </svg>
        <span matListItemTitle>About</span>
      </button>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-shell__content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
